<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }} | {{ site.title }}</title>

    <link rel="stylesheet"
          href="{{ '/assets/css/style.css' | relative_url }}">

    <link rel="icon"
      type="image/png"
      href="{{ '/assets/images/favicon.png' | relative_url }}">

<!-- MathJax for mathematical equations -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]']]
  }
};
</script>

<script
  id="MathJax-script"
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>

</head>






<body>

<header class="site-header">
    <div class="site-header-inner">

        <a class="site-title" href="{{ '/' | relative_url }}">
            Digital Graphics Foundations
        </a>

        <nav class="top-nav">
            <a href="{{ '/' | relative_url }}">Home</a>
            <a href="{{ '/' | relative_url }}#lessons">Lessons</a>
            <a href="{{ '/' | relative_url }}#software">Software</a>
        </nav>

    </div>
</header>


<main class="page-layout">

    {% if page.lesson %}
    <div class="lesson-label">
        Lesson {{ page.lesson }}
    </div>
    {% endif %}

    <article class="article">
        {{ content }}
    </article>

</main>


<footer class="site-footer">

    <div class="footer-inner">

        <div>
            <strong>Digital Graphics Foundations</strong>
            <p>foundations of digital graphic design.</p>
        </div>

        <div class="author">
            Written and maintained by
            <a href="https://www.linkedin.com/in/hano-alolyan"
               target="_blank"
               rel="noopener noreferrer">
                Alhanouf Alolyan
            </a>
        </div>

    </div>

</footer>

</body>
</html>
